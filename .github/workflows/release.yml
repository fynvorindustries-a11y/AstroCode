# Builds ASTRO from this repo and publishes a signed, file-level update to the AstroLauncher releases.
#
# Trigger: push a plain version tag in THIS repo (AstroCode), e.g.  git tag 5.1.0 && git push origin 5.1.0
#          (or run it by hand: Actions > Release > Run workflow > version).
#
# What it does, in plain words:
#   1. builds the launcher + a Windows app image (ASTRO/ASTRO.exe + runtime + jars)
#   2. downloads the previous release's update-manifest.json from AstroLauncher
#   3. hashes EVERY file of the new build against it  -> that is the "which files changed" step
#   4. packs the files into payload.pack, writes + signs update-manifest.json
#   5. publishes the release to AstroLauncher (as a draft first, so users never see a half-uploaded release)
# Installed launchers then fetch the manifest, hash their own files, and download ONLY the ones that differ.
#
# One-time setup (repo Settings > Secrets and variables > Actions):
#   UPDATE_SIGNING_KEY  base64 PKCS#8 Ed25519 private key whose public half is in src/main/resources/updater/trusted-keys.json (id k1)
#   RELEASE_TOKEN       fine-grained PAT with "Contents: read & write" on fynvorindustries-a11y/AstroLauncher
name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (MAJOR.MINOR.PATCH, no "v")'
        required: true

permissions:
  contents: read

env:
  LAUNCHER_REPO: fynvorindustries-a11y/AstroLauncher
  APP_NAME: ASTRO
  MAIN_CLASS: com.astrolauncher.AstroLauncherApplication

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve version
        run: |
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ]; then V="${GITHUB_REF_NAME}"; fi
          if ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version '$V' must be MAJOR.MINOR.PATCH with no 'v' prefix (the updater ignores anything else)."; exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew installDist -PappVersion="$VERSION" --no-daemon

      - name: Check the build really carries this version
        run: |
          F=$(find build -name version.properties | head -1)
          echo "$F: $(cat "$F")"
          grep -q "app.version=$VERSION" "$F" || {
            echo "::error::Built version is not $VERSION. the version in build.gradle must come from -PappVersion."; exit 1; }

      - name: Make the Windows app image
        run: |
          LIBDIR=$(ls -d build/install/*/lib | head -1)
          MAINJAR=$(basename "$(ls build/libs/*.jar | grep -v -- '-plain' | head -1)")
          test -f "$LIBDIR/$MAINJAR" || { echo "::error::$MAINJAR not found in $LIBDIR"; exit 1; }
          mkdir -p dist
          jpackage --type app-image --name "$APP_NAME" --dest dist \
            --input "$LIBDIR" --main-jar "$MAINJAR" --main-class "$MAIN_CLASS" \
            --app-version "$VERSION"
          test -f "dist/$APP_NAME/$APP_NAME.exe" || { echo "::error::jpackage did not produce $APP_NAME.exe"; exit 1; }

      - name: Full download for fresh installs (also the fallback)
        run: 7z a -tzip -mx=7 "$APP_NAME-$VERSION-win.zip" "./dist/$APP_NAME" > /dev/null

      - name: Get the previous manifest (what the last release shipped)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          # If the latest release has no manifest (e.g. the old AveroLauncher ones), this simply fails and the
          # first Astro release is treated as "everything is new". That is expected once.
          gh release download --repo "$LAUNCHER_REPO" --pattern update-manifest.json --output prev-manifest.json \
            && echo "HAVE_PREV=1" >> "$GITHUB_ENV" || echo "No previous manifest found; first incremental release."

      - name: Release notes from the commits since the last tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' "HEAD^" 2>/dev/null || true)
          {
            echo "ASTRO $VERSION"
            echo
            if [ -n "$PREV_TAG" ]; then git log --pretty='- %s' "$PREV_TAG..HEAD"; else git log -n 20 --pretty='- %s'; fi
          } > notes.md

      - name: Find which files changed, pack them and sign the manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          GEN=$(find src -name ReleaseGenerator.java | head -1)
          ARGS=(--image "dist/$APP_NAME" --version "$VERSION" --launcher "$APP_NAME.exe" --out release-out \
                --key-env UPDATE_SIGNING_KEY --key-id k1 --notes notes.md --app "$APP_NAME")
          if [ "${HAVE_PREV:-}" = "1" ]; then ARGS+=(--previous-manifest prev-manifest.json); fi
          java "$GEN" "${ARGS[@]}"
          { echo '### Files changed since the previous release'; echo '```'; cat release-out/release-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to AstroLauncher
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          # Draft first, then publish: an installed launcher never sees a release whose files are still uploading.
          gh release create "$VERSION" --repo "$LAUNCHER_REPO" --draft --title "ASTRO $VERSION" --notes-file notes.md \
            release-out/payload.pack release-out/update-manifest.json release-out/update-manifest.json.sig \
            "$APP_NAME-$VERSION-win.zip"
          gh release edit "$VERSION" --repo "$LAUNCHER_REPO" --draft=false --latest
